<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2A2F5C"/>
      <stop offset="0.55" stop-color="#151834"/>
      <stop offset="1" stop-color="#0A0B1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#7C83FF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#7C83FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="claude" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0703F"/>
      <stop offset="1" stop-color="#FFB58A"/>
    </linearGradient>
    <linearGradient id="codex" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12B886"/>
      <stop offset="1" stop-color="#7EF2CF"/>
    </linearGradient>
    <linearGradient id="gemini" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D5BFF"/>
      <stop offset="1" stop-color="#9CC4FF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="bloom" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- body -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- usage bars: track, bloom, fill, gloss -->
  <g transform="translate(232 336)">
    <rect width="560" height="76" rx="38" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect width="448" height="76" rx="38" fill="url(#claude)" opacity="0.55" filter="url(#bloom)"/>
    <rect width="448" height="76" rx="38" fill="url(#claude)"/>
    <rect x="14" y="4" width="420" height="34" rx="17" fill="url(#gloss)"/>
  </g>
  <g transform="translate(232 474)">
    <rect width="560" height="76" rx="38" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect width="300" height="76" rx="38" fill="url(#codex)" opacity="0.5" filter="url(#bloom)"/>
    <rect width="300" height="76" rx="38" fill="url(#codex)"/>
    <rect x="14" y="4" width="272" height="34" rx="17" fill="url(#gloss)"/>
  </g>
  <g transform="translate(232 612)">
    <rect width="560" height="76" rx="38" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect width="380" height="76" rx="38" fill="url(#gemini)" opacity="0.55" filter="url(#bloom)"/>
    <rect width="380" height="76" rx="38" fill="url(#gemini)"/>
    <rect x="14" y="4" width="352" height="34" rx="17" fill="url(#gloss)"/>
  </g>
</svg>
